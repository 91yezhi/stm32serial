[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32serial"
version = "0.1.0"
description = "A tiny, testable CLI toolkit for STM32 serial telemetry: read, filter, aggregate and export."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "91yezhi", email = "gao13925442651@outlook.com" }]
keywords = ["stm32", "serial", "uart", "telemetry", "cli", "embedded", "pyserial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
stm32serial = "stm32serial.cli:main"

[project.urls]
Homepage = "https://github.com/91yezhi/stm32serial"
Source = "https://github.com/91yezhi/stm32serial"
Issues = "https://github.com/91yezhi/stm32serial/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]